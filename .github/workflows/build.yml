name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      version_tag: ${{ steps.check.outputs.version_tag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run version check script
      id: check
      run: python scripts/check_version.py

  auto_tag:
    name: Auto Tag Version
    runs-on: ubuntu-latest
    needs: check_version
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && needs.check_version.outputs.version_changed == 'true'
    outputs:
      created_tag: ${{ needs.check_version.outputs.version_tag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Create tag if missing
      shell: bash
      run: |
        VERSION_TAG="${{ needs.check_version.outputs.version_tag }}"
        if git ls-remote --tags origin "refs/tags/$VERSION_TAG" | grep -q "$VERSION_TAG"; then
          echo "标签已存在: $VERSION_TAG，跳过创建。"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "$VERSION_TAG"
        git push origin "$VERSION_TAG"
        echo "已创建并推送标签: $VERSION_TAG"

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: check_version
    if: always() && !cancelled() && needs.check_version.outputs.version_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    
    env:
      PYTHONIOENCODING: utf-8
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install "nuitka[onefile]" pyinstaller

    - name: Create .env from secrets
      shell: bash
      run: |
        # 从 GitHub Secrets 生成 .env（随产物打包，运行时供程序读取数据库/API 配置）
        cat > .env << 'EOF'
        DB1_PASSWORD=${{ secrets.DB1_PASSWORD }}
        DB2_PASSWORD=${{ secrets.DB2_PASSWORD }}
        ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
        API_TOKEN=${{ secrets.API_TOKEN }}
        EOF
        if [ -z "${{ secrets.API_TOKEN }}" ]; then
          echo "警告: 未配置 secrets.API_TOKEN，产物将无法访问外部工单系统 API"
        fi
        if [ -z "${{ secrets.DB1_PASSWORD }}" ]; then
          echo "警告: 未配置 secrets.DB1_PASSWORD，产物将无法连接数据库"
        fi

    - name: Build Windows
      if: matrix.os == 'windows-latest'
      run: |
        python scripts/build_nuitka.py --mode=both
        python scripts/build_script.py --onefile

    - name: Build macOS
      if: matrix.os == 'macos-latest'
      run: |
        # 运行 build_nuitka.py 自动构建标准版与控制台调试版双版本及对应 DMG / ZIP
        python scripts/build_nuitka.py

        # 检查 dist 目录下生成的产物
        echo "=== dist 目录构建产物 ==="
        ls -lah dist/ || true

    - name: Upload Artifacts (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: |
          dist/*.exe
          dist/*.zip
        if-no-files-found: error

    - name: Upload Artifacts (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: |
          dist/*.dmg
          dist/*.zip
        if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check_version, build]
    if: |
      always() &&
      !cancelled() &&
      needs.build.result == 'success' &&
      (
        startsWith(github.ref, 'refs/tags/') ||
        (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && needs.check_version.outputs.version_changed == 'true')
      )
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-build"
          path: release-assets
          merge-multiple: true

      - name: Show release assets
        shell: bash
        run: |
          ls -lah release-assets

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.check_version.outputs.version_tag }}
          artifacts: "release-assets/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          body: |
            ### 📦 资产下载与安装指南
            
            | 发布文件 | 操作系统 | 推荐场景 | 说明 |
            |---|---|---|---|
            | `WorkOrder_System_${{ needs.check_version.outputs.version_tag }}_Portable.exe` | Windows | 便携拷贝 | **Nuitka 单文件版**（内置版本持久化解压缓存） |
            | `WorkOrder_System_${{ needs.check_version.outputs.version_tag }}_Standalone.zip` | Windows | **日常推荐** | **Nuitka 绿色免安装版**（免解压直接运行，0.5秒秒开） |
            | `WorkOrder_System_${{ needs.check_version.outputs.version_tag }}_PyInstaller.exe` | Windows | 兼容备用 | **PyInstaller 单文件版**（传统打包引擎构建） |
            | `WorkOrder_System_${{ needs.check_version.outputs.version_tag }}.dmg` | macOS | **苹果日常推荐** | **macOS 原生安装镜像【标准版】**（纯净无控制台） |
            | `WorkOrder_System_${{ needs.check_version.outputs.version_tag }}_Debug.dmg` | macOS | **苹果排错调试** | **macOS 原生安装镜像【控制台调试版】**（内置双击一键调起终端日志） |
            | `WorkOrder_System_${{ needs.check_version.outputs.version_tag }}.zip` | macOS | 苹果电脑 | **macOS 便携绿色包【标准版】** |
            | `WorkOrder_System_${{ needs.check_version.outputs.version_tag }}_Debug.zip` | macOS | 苹果电脑 | **macOS 便携绿色包【控制台调试版】** |

