name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check_version:
    name: Check Version Change
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check.outputs.version_changed }}
      version_tag: ${{ steps.check.outputs.version_tag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run version check script
      id: check
      run: python scripts/check_version.py

  auto_tag:
    name: Auto Tag Version
    runs-on: ubuntu-latest
    needs: check_version
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && needs.check_version.outputs.version_changed == 'true'
    outputs:
      created_tag: ${{ needs.check_version.outputs.version_tag }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Create tag if missing
      shell: bash
      run: |
        VERSION_TAG="${{ needs.check_version.outputs.version_tag }}"
        if git ls-remote --tags origin "refs/tags/$VERSION_TAG" | grep -q "$VERSION_TAG"; then
          echo "标签已存在: $VERSION_TAG，跳过创建。"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag "$VERSION_TAG"
        git push origin "$VERSION_TAG"
        echo "已创建并推送标签: $VERSION_TAG"

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: check_version
    if: always() && !cancelled() && needs.check_version.outputs.version_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    
    env:
      PYTHONIOENCODING: utf-8
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install "nuitka[onefile]" pyinstaller

    - name: Create .env from secrets
      shell: bash
      run: |
        # 从 GitHub Secrets 生成 .env（随产物打包，运行时供程序读取数据库/API 配置）
        cat > .env << 'EOF'
        DB1_PASSWORD=${{ secrets.DB1_PASSWORD }}
        DB2_PASSWORD=${{ secrets.DB2_PASSWORD }}
        ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
        API_TOKEN=${{ secrets.API_TOKEN }}
        EOF
        if [ -z "${{ secrets.API_TOKEN }}" ]; then
          echo "警告: 未配置 secrets.API_TOKEN，产物将无法访问外部工单系统 API"
        fi
        if [ -z "${{ secrets.DB1_PASSWORD }}" ]; then
          echo "警告: 未配置 secrets.DB1_PASSWORD，产物将无法连接数据库"
        fi

    - name: Build Windows
      if: matrix.os == 'windows-latest'
      run: |
        python scripts/build_nuitka.py --mode=both

    - name: Build macOS
      if: matrix.os == 'macos-latest'
      run: |
        python scripts/build_nuitka.py

        # 多层级搜索并就位 .app 产物
        APP_PATH=$(find . -name "*.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "错误: 未找到任何 .app 产物"
          exit 1
        fi
        
        # 若不在当前根目录，移动到当前根目录
        APP_BASENAME=$(basename "$APP_PATH")
        if [ "$APP_PATH" != "./$APP_BASENAME" ] && [ "$APP_PATH" != "$APP_BASENAME" ]; then
          echo "移动应用包到当前目录: $APP_PATH -> ./$APP_BASENAME"
          rm -rf "./$APP_BASENAME"
          mv "$APP_PATH" "./$APP_BASENAME"
          APP_PATH="./$APP_BASENAME"
        fi
        
        APP_NAME=$(basename "$APP_PATH" .app)
        echo "Found app: $APP_PATH"
        echo "App Name: $APP_NAME"
        
        # 确保 Contents/MacOS 下的文件具有可执行权限
        chmod -R +x "$APP_PATH/Contents/MacOS" || true
        
        # 清理扩展属性并等待文件系统/Spotlight 释放占用，避免 hdiutil 报 Resource busy
        xattr -cr "$APP_PATH" 2>/dev/null || true
        sleep 3
        
        # Create DMG using hdiutil (standard macOS tool)，带重试机制
        for i in 1 2 3 4 5; do
          if hdiutil create -volname "$APP_NAME" -srcfolder "$APP_PATH" -ov -format UDZO "$APP_NAME.dmg"; then
            echo "DMG 创建成功"
            break
          fi
          echo "hdiutil 创建 DMG 失败（第 ${i} 次），等待 5 秒后重试..."
          sleep 5
          if [ "$i" -eq 5 ]; then
            echo "hdiutil 重试 5 次仍失败，退出构建"
            exit 1
          fi
        done
        
        # Zip the .app for alternative distribution
        zip -r -y "$APP_NAME.zip" "$APP_PATH"

    - name: Upload Artifacts (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: |
          dist/*.exe
          dist/*.zip
        if-no-files-found: error

    - name: Upload Artifacts (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: |
          *.dmg
          *.zip
          *.app
        if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check_version, build]
    if: |
      always() &&
      !cancelled() &&
      needs.build.result == 'success' &&
      (
        startsWith(github.ref, 'refs/tags/') ||
        (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && needs.check_version.outputs.version_changed == 'true')
      )
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: "*-build"
        path: release-assets
        merge-multiple: true

    - name: Show release assets
      shell: bash
      run: |
        ls -lah release-assets

    - name: Create Release
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ needs.check_version.outputs.version_tag }}
        artifacts: "release-assets/*"
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
